services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped

  mongodb:
    image: mongo:7-jammy
    container_name: ecommerce-mongo
    environment:
      MONGO_INITDB_DATABASE: ecommerce_users
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      EUREKA_HOST: eureka-server
    stop_grace_period: 35s
    restart: unless-stopped

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ecommerce_users
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - mongodb
      - eureka-server
    stop_grace_period: 35s
    restart: unless-stopped

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce_products
      DB_USER: postgres
      DB_PASSWORD: postgres
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
    stop_grace_period: 35s
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce_orders
      DB_USER: postgres
      DB_PASSWORD: postgres
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    depends_on:
      - postgres
      - eureka-server
      - user-service
      - product-service
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
